<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>播放｜剧搜</title><link rel="stylesheet" href="./assets/css/style.css"></head>
<body class="player-page"><header class="site-header"><a class="brand" href="./"><span class="brand-mark">剧</span><span>剧搜</span></a><div class="header-actions"><button class="profile-button" id="back">返回详情</button></div></header>
<main class="player-shell"><section class="video-stage"><video id="video" controls playsinline preload="metadata"></video><button class="player-message" id="message" type="button"><b>正在准备播放…</b><span>请稍候</span></button></section><div class="player-title"><div><span class="section-kicker">正在播放</span><h1 id="title">加载中…</h1></div><button class="secondary-button" id="fav">♡ 收藏</button></div><section class="episode-panel"><div class="section-head"><div><span class="section-kicker">选集</span><h2>剧集列表</h2></div></div><div class="episode-list" id="episodes"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script><script src="./assets/js/data.js"></script><script>
(async function(){var q=new URLSearchParams(location.search),id=q.get("id"),current=Math.max(0,parseInt(q.get("episode")||"0")),movie,video=document.getElementById("video"),msg=document.getElementById("message"),hls;
function showPlay(text,sub){msg.style.display="flex";msg.innerHTML="<b>"+text+"</b><span>"+sub+"</span>"}function tryPlay(){video.play().then(function(){msg.style.display="none"}).catch(function(){showPlay("▶ 点击开始播放","片源已就绪")})}
function play(i){var ep=movie.episodeList&&movie.episodeList[i];current=i;Jusou.saveProgress(movie,i);document.querySelectorAll(".episode-list button").forEach(function(b,n){b.classList.toggle("active",n===i)});if(!ep||!ep.url){video.style.display="none";showPlay("该剧暂未提供可播放片源","你可以先收藏，稍后再来看");return}video.style.display="block";video.poster=movie.cover||"";showPlay("正在加载视频…","片源准备中");if(hls)hls.destroy();if(ep.url.indexOf(".m3u8")>-1&&window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true});hls.loadSource(ep.url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,tryPlay);hls.on(Hls.Events.ERROR,function(_,d){if(d.fatal)showPlay("当前片源播放失败","请尝试其他剧集")})}else{video.src=ep.url;video.load();video.oncanplay=tryPlay;video.onerror=function(){showPlay("当前片源播放失败","请尝试其他剧集")}}}
msg.onclick=function(){if(video.readyState>=2)tryPlay()};if(!id){location.href="/";return}try{movie=await Jusou.detail(id);document.title=movie.name+"｜剧搜";document.getElementById("title").textContent=movie.name;document.getElementById("back").onclick=function(){Jusou.openDetail(movie.id)};var fav=document.getElementById("fav");fav.textContent=Jusou.isFavorite(movie.id)?"♥ 已收藏":"♡ 收藏";fav.onclick=function(){var a=Jusou.toggleFavorite(movie);fav.textContent=a?"♥ 已收藏":"♡ 收藏"};var eps=movie.episodeList||[];document.getElementById("episodes").innerHTML=eps.length?eps.map(function(e,i){return'<button class="'+(i===current?"active":"")+'" data-index="'+i+'">'+(e.name||"第"+(i+1)+"集")+"</button>"}).join(""):'<p class="muted">暂无剧集信息</p>';document.getElementById("episodes").onclick=function(e){var b=e.target.closest("[data-index]");if(b)play(Number(b.dataset.index))};play(Math.min(current,Math.max(0,eps.length-1)))}catch{showPlay("播放信息加载失败","请返回首页稍后重试")}})();
</script></body></html>
