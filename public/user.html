<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的片单｜剧搜</title><link rel="stylesheet" href="./assets/css/style.css"></head>
<body><header class="site-header"><a class="brand" href="./"><span class="brand-mark">剧</span><span>剧搜</span></a><div class="header-actions"><a class="profile-button" href="./">返回首页</a></div></header>
<main class="page-shell"><section class="profile-hero"><div class="avatar" id="avatar">剧</div><div><span class="section-kicker">个人中心</span><h1 id="name">追剧同学</h1><p>收藏喜欢的故事，随时接着上次继续。</p></div><button class="secondary-button" id="edit">编辑昵称</button></section>
<section class="page-section"><div class="section-head"><div><span class="section-kicker">稍后继续</span><h2>观看记录</h2></div><button class="text-button" id="clearHistory">清空记录</button></div><div class="library-list" id="history"></div></section>
<section class="page-section"><div class="section-head"><div><span class="section-kicker">我的珍藏</span><h2>收藏片单</h2></div></div><div class="library-list" id="favorites"></div></section></main><div class="toast" id="toast"></div>
<script src="./assets/js/data.js"></script><script>
(function(){var p=Jusou.profile();document.getElementById("name").textContent=p.name;document.getElementById("avatar").textContent=p.avatar||"剧";function esc(v){return String(v||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}function row(x,type){return'<article class="library-item" data-id="'+esc(x.id)+'"><div class="library-thumb">'+(x.cover?'<img src="'+esc(x.cover)+'" alt="">':"<span>剧</span>")+'</div><div><h3>'+esc(x.name)+'</h3><p>'+esc(x.type||"短剧")+(type==="history"?" · 看到第"+((x.episode||0)+1)+"集":"")+'</p></div><button data-action="'+type+'">'+(type==="history"?"继续播放":"移除")+'</button></article>'}function draw(){var h=Jusou.history(),f=Jusou.favorites();document.getElementById("history").innerHTML=h.length?h.map(function(x){return row(x,"history")}).join(""):'<div class="empty-state"><h3>还没有观看记录</h3><p>去首页挑一部好剧开始吧。</p></div>';document.getElementById("favorites").innerHTML=f.length?f.map(function(x){return row(x,"favorite")}).join(""):'<div class="empty-state"><h3>片单还是空的</h3><p>遇到喜欢的短剧，点一下爱心收藏。</p></div>'}document.addEventListener("click",function(e){var a=e.target.closest("[data-action]"),item=e.target.closest("[data-id]");if(a&&item){e.stopPropagation();if(a.dataset.action==="history")Jusou.openPlayer(item.dataset.id,0);else{var m=Jusou.favorites().find(function(x){return String(x.id)===item.dataset.id});if(m)Jusou.toggleFavorite(m);draw()}}else if(item)Jusou.openDetail(item.dataset.id)});document.getElementById("clearHistory").onclick=function(){if(confirm("确定清空全部观看记录吗？")){localStorage.removeItem("jusou:history");draw()}};document.getElementById("edit").onclick=function(){var n=prompt("请输入昵称",p.name);if(n&&n.trim()){p.name=n.trim().slice(0,16);Jusou.saveProfile(p);document.getElementById("name").textContent=p.name}};draw()})();
</script></body></html>
