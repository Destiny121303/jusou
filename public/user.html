<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050807"><title>个人中心｜剧搜</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./assets/css/style.css?v=9"><link rel="stylesheet" href="./assets/css/product.css?v=9"></head>
<body><header class="site-header"><a class="brand" href="./index.html"><span class="brand-mark">剧</span><span>剧搜</span></a><nav class="desktop-nav"><a href="./index.html">首页</a><a href="./explore.html">分类</a><a href="./membership.html">会员</a><a href="./business.html">商务</a><a href="./app.html">App</a></nav><div class="header-actions"><button class="icon-button" id="themeToggle" data-icon="sun" aria-label="切换主题"></button><a class="profile-button active" data-icon="user" href="./user.html">个人中心</a></div></header>
<main class="account-shell"><section class="account-hero"><div class="account-orbit"><i></i><i></i><div class="avatar-xl" id="avatar">剧</div></div><div class="account-identity"><span class="section-kicker">PERSONAL COMMAND CENTER</span><h1 id="name">追剧同学</h1><p><span class="status-dot"></span><b id="memberLabel">体验账户</b> · 数据仅保存在当前设备</p><div class="account-actions"><button class="primary-button" id="edit" data-icon="edit">编辑昵称</button><a class="secondary-button" href="./membership.html" data-icon="crown">升级 PRIME</a></div></div><div class="account-radar"><span>ACCOUNT SIGNAL</span><strong id="profileScore">72</strong><small>收藏、观看与资料完整度</small><i style="--score:72%"><b></b></i></div></section>
<section class="account-stats"><article><span data-icon="play"></span><strong id="historyCount">0</strong><small>观看记录</small></article><article><span data-icon="heart"></span><strong id="favoriteCount">0</strong><small>收藏内容</small></article><article><span data-icon="pulse"></span><strong id="trialTime">60</strong><small>剩余分钟</small></article><article><span data-icon="crown"></span><strong id="memberState">FREE</strong><small>当前等级</small></article></section>
<section class="account-console"><nav class="account-tabs" aria-label="个人中心功能"><button class="active" data-tab="continue" data-icon="play">继续观看</button><button data-tab="favorites" data-icon="heart">收藏片单</button><button data-tab="settings" data-icon="settings">偏好设置</button></nav>
<div class="account-panel active" data-panel="continue"><div class="account-panel-head"><div><span class="section-kicker">CONTINUE WATCHING</span><h2>接着上次继续</h2></div><button class="text-button" id="clearHistory">清空记录</button></div><div class="account-library" id="history"></div></div>
<div class="account-panel" data-panel="favorites"><div class="account-panel-head"><div><span class="section-kicker">MY COLLECTION</span><h2>我的收藏宇宙</h2></div><a class="text-button" href="./explore.html">发现更多 →</a></div><div class="account-library" id="favorites"></div></div>
<div class="account-panel" data-panel="settings"><div class="account-panel-head"><div><span class="section-kicker">PREFERENCE ENGINE</span><h2>播放与视觉偏好</h2></div></div><div class="settings-grid"><article><div><strong>自动续播</strong><small>打开剧集时自动继续上次进度</small></div><button class="switch active" data-setting="autoplay" aria-label="自动续播"><i></i></button></article><article><div><strong>流量保护</strong><small>移动网络优先使用较低清晰度</small></div><button class="switch" data-setting="datasaver" aria-label="流量保护"><i></i></button></article><article class="theme-setting"><div><strong>能量主题</strong><small>选择你的界面渐变色</small></div><div class="theme-dots"><button data-theme="0" style="--dot:#30f28c"></button><button data-theme="1" style="--dot:#46a7ff"></button><button data-theme="2" style="--dot:#b06cff"></button><button data-theme="3" style="--dot:#ff6b91"></button><button data-theme="4" style="--dot:#ffc857"></button><button data-theme="5" style="--dot:#3de7e2"></button></div></article></div></div></section></main>
<nav class="mobile-nav"><a data-icon="home" href="./index.html"><span>首页</span></a><a data-icon="search" href="./explore.html"><span>分类</span></a><a data-icon="crown" href="./membership.html"><span>会员</span></a><a data-icon="rocket" href="./app.html"><span>App</span></a><a class="active" data-icon="user" href="./user.html"><span>我的</span></a></nav><div class="toast" id="toast"></div>
<script src="./assets/js/data.js?v=9"></script><script src="./assets/js/ui.js?v=9"></script><script src="./assets/js/shell.js?v=9"></script><script>(function(){var p=Jusou.profile();function esc(v){return String(v||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}function item(x,type){return'<article class="account-media" tabindex="0" data-id="'+esc(x.id)+'"><div class="account-cover">'+(x.cover?'<img src="'+esc(x.cover)+'" alt="" loading="lazy">':'<span>剧</span>')+'<i data-icon="'+(type==="history"?"play":"heart")+'"></i></div><div><span class="section-kicker">'+(type==="history"?"CONTINUE":"SAVED")+'</span><h3>'+esc(x.name)+'</h3><p>'+esc(x.type||"短剧")+(type==="history"?" · 第"+((x.episode||0)+1)+"集":"")+'</p></div><button data-action="'+type+'" data-icon="'+(type==="history"?"play":"close")+'" aria-label="'+(type==="history"?"继续播放":"移除收藏")+'"></button></article>'}function draw(){var h=Jusou.history(),f=Jusou.favorites(),used=Math.max(0,Number(localStorage.getItem("jusou:trial-seconds")||0)),left=Math.ceil(Math.max(0,3600-used)/60),active=localStorage.getItem("jusou:member-status")==="active";document.getElementById("name").textContent=p.name;document.getElementById("avatar").textContent=p.avatar||"剧";document.getElementById("historyCount").textContent=h.length;document.getElementById("favoriteCount").textContent=f.length;document.getElementById("trialTime").textContent=active?"∞":left;document.getElementById("memberState").textContent=active?"PRIME":"FREE";document.getElementById("memberLabel").textContent=active?"PRIME 会员":"体验账户";var score=Math.min(99,58+h.length*3+f.length*4+(p.name!=="追剧同学"?8:0));document.getElementById("profileScore").textContent=score;document.querySelector(".account-radar>i").style.setProperty("--score",score+"%");document.getElementById("history").innerHTML=h.length?h.map(function(x){return item(x,"history")}).join(""):'<div class="account-empty"><b>播放轨道还是空的</b><span>去热播区选一部短剧，观看进度会自动出现在这里。</span><a href="./index.html">去看热播 →</a></div>';document.getElementById("favorites").innerHTML=f.length?f.map(function(x){return item(x,"favorite")}).join(""):'<div class="account-empty"><b>收藏宇宙等待点亮</b><span>遇到喜欢的短剧，点击爱心即可收藏。</span><a href="./explore.html">发现好剧 →</a></div>';if(window.NeonUI)NeonUI.icons()}document.addEventListener("click",function(e){var tab=e.target.closest("[data-tab]"),action=e.target.closest("[data-action]"),media=e.target.closest("[data-id]"),toggle=e.target.closest("[data-setting]"),theme=e.target.closest("[data-theme]");if(tab){document.querySelectorAll("[data-tab]").forEach(function(x){x.classList.toggle("active",x===tab)});document.querySelectorAll("[data-panel]").forEach(function(x){x.classList.toggle("active",x.dataset.panel===tab.dataset.tab)})}else if(action&&media){e.stopPropagation();if(action.dataset.action==="history")Jusou.openPlayer(media.dataset.id,0);else{var m=Jusou.favorites().find(function(x){return String(x.id)===media.dataset.id});if(m)Jusou.toggleFavorite(m);draw()}}else if(media)Jusou.openDetail(media.dataset.id);if(toggle){toggle.classList.toggle("active");localStorage.setItem("jusou:setting:"+toggle.dataset.setting,toggle.classList.contains("active")?"1":"0")}if(theme){localStorage.setItem("jusou:theme",theme.dataset.theme);document.getElementById("themeToggle").click()}});document.getElementById("clearHistory").onclick=function(){if(confirm("确定清空全部观看记录吗？")){localStorage.removeItem("jusou:history");draw()}};document.getElementById("edit").onclick=function(){var n=prompt("请输入昵称",p.name);if(n&&n.trim()){p.name=n.trim().slice(0,16);Jusou.saveProfile(p);draw()}};document.querySelectorAll("[data-setting]").forEach(function(x){x.classList.toggle("active",localStorage.getItem("jusou:setting:"+x.dataset.setting)==="1"||x.dataset.setting==="autoplay"&&localStorage.getItem("jusou:setting:autoplay")!== "0")});draw()})();</script></body></html>
