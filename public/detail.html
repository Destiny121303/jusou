<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>短剧详情 - 剧搜</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="header">
  <div class="logo" onclick="location.href='index.html'">剧搜</div>
  <div class="header-right">
    <button class="login-btn" onclick="location.href='index.html'">← 返回首页</button>
  </div>
</header>

<main class="detail-page">
  <section class="detail-top">
    <div class="detail-cover">
      <img id="cover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 400'%3E%3Crect width='300' height='400' fill='%2312121a'/%3E%3C/svg%3E">
      <div class="play-overlay" onclick="playDrama()"><span class="icon">▶</span></div>
    </div>
    <div class="detail-info">
      <h1 id="name">加载中...</h1>
      <div class="detail-tags" id="tags"></div>
      <div class="detail-meta">
        热度：<span id="hot">--</span> · 演员：<span id="actor">--</span><br>
        <span id="year">--</span> · <span id="area">--</span>
      </div>
      <div class="detail-actions">
        <button class="primary" onclick="playDrama()">▶ 立即播放</button>
        <button class="secondary" onclick="favorite()">⭐ 收藏</button>
      </div>
    </div>
  </section>

  <section class="detail-body">
    <h2>剧情简介</h2>
    <p id="intro">加载中...</p>
  </section>

  <section class="episodes">
    <h2>相关推荐</h2>
    <div class="movie-scroll" id="recommendList"></div>
  </section>
</main>

<div class="toast" id="toast">操作成功</div>

<script src="assets/js/data.js"></script>
<script>
(function(){
  var id = localStorage.getItem("detailId");
  var drama = null;

  if (!id) { document.getElementById("name").innerText = "请选择剧集"; return; }

  drama = getDrama(id);
  if (drama) { renderDetail(drama); }
  else { getDramaDetail(id, function(d){ if (d) { drama = d; renderDetail(d); } else { document.getElementById("name").innerText = "获取详情失败"; } }); }

  function renderDetail(item) {
    document.title = item.name + " - 剧搜";
    document.getElementById("name").innerText = item.name;
    document.getElementById("hot").innerText = item.hot || "--";
    document.getElementById("actor").innerText = item.actor || "未知";
    document.getElementById("year").innerText = item.year || "--";
    document.getElementById("area").innerText = item.area || "--";
    document.getElementById("intro").innerText = item.intro || "暂无简介";
    if (item.cover) document.getElementById("cover").src = item.cover;

    var tags = document.getElementById("tags");
    tags.innerHTML = "";
    if (item.type) { var t = document.createElement("span"); t.innerText = item.type; tags.appendChild(t); }
    if (item.score > 0) { var s = document.createElement("span"); s.innerText = "⭐ " + item.score; tags.appendChild(s); }
    if (item.remarks) { var r = document.createElement("span"); r.innerText = item.remarks; tags.appendChild(r); }

    var rec = document.getElementById("recommendList");
    var related = dramas.filter(function(d){ return d.id != item.id; }).slice(0,8);
    if (!related.length) { rec.innerHTML = '<p style="color:var(--muted);padding:10px">暂无推荐</p>'; }
    else {
      rec.innerHTML = related.map(function(d){
        return "<div class=\"movie-card\" onclick=\"openDetail("+d.id+")\">" +
          "<div class=\"poster-box\"><span class=\"fallback\">🎬</span>" +
          "<img class=\"poster-img\" src=\""+(d.cover||"")+"\" onerror=\"this.style.display='none'\">" +
          "<button class=\"play-btn\">▶</button></div>" +
          "<div class=\"movie-info\"><h3>"+d.name+"</h3></div></div>";
      }).join("");
    }
  }

  window.playDrama = function(){
    if (!drama) return;
    saveHistory(drama); location.href = "play.html";
  };

  window.favorite = function(){
    if (!drama) return;
    var list = JSON.parse(localStorage.getItem("favorite")||"[]");
    if (!list.find(function(i){return i.id===drama.id})) {
      list.push({id:drama.id,name:drama.name,cover:drama.cover});
      localStorage.setItem("favorite",JSON.stringify(list));
      showToast("收藏成功");
    } else { showToast("已经收藏"); }
  };

  window.openDetail = function(did){
    localStorage.setItem("detailId",did); location.href="detail.html";
  };

  function showToast(t){
    var el=document.getElementById("toast");
    if(!el)return; el.innerText=t; el.classList.add("show");
    clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove("show")},1500);
  }
})();
</script>
</body>
</html>
