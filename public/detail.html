<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>短剧详情｜剧搜</title><link rel="stylesheet" href="./assets/css/style.css"></head>
<body><header class="site-header"><a class="brand" href="./"><span class="brand-mark">剧</span><span>剧搜</span></a><div class="header-actions"><a class="profile-button" href="./">返回首页</a></div></header>
<main class="page-shell"><div class="detail-layout" id="detail"><div class="page-loading">正在读取剧集信息…</div></div><section class="page-section"><div class="section-head"><div><span class="section-kicker">猜你喜欢</span><h2>继续发现</h2></div></div><div class="movie-grid" id="recommendations"></div></section></main><div class="toast" id="toast"></div>
<script src="./assets/js/data.js"></script><script>
(async function(){var id=new URLSearchParams(location.search).get("id"),box=document.getElementById("detail"),movie;function esc(v){return String(v||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},1600)}
if(!id){box.innerHTML='<div class="empty-state"><h3>没有选择短剧</h3><a href="/">返回首页</a></div>';return}try{movie=await Jusou.detail(id);if(!movie)throw Error();document.title=movie.name+"｜剧搜";box.innerHTML='<div class="detail-art">'+(movie.cover?'<img src="'+esc(movie.cover)+'" alt="">':'<div class="poster-fallback"><span>剧搜</span><strong>'+esc(movie.name)+'</strong></div>')+'</div><div class="detail-copy"><span class="section-kicker">'+esc(movie.type)+'</span><h1>'+esc(movie.name)+'</h1><div class="detail-tags"><span>★ '+(movie.score||"暂无评分")+'</span><span>'+esc(movie.year)+'</span><span>'+esc(movie.area)+'</span><span>'+esc(movie.remarks)+'</span></div><p class="detail-actors">主演：'+esc(movie.actor)+'</p><p class="detail-intro">'+esc(movie.intro)+'</p><div class="detail-actions"><button class="primary-button" id="play">▶ 立即播放</button><button class="secondary-button" id="favorite">'+(Jusou.isFavorite(movie.id)?"♥ 已收藏":"♡ 加入片单")+'</button></div></div>';
document.getElementById("play").onclick=function(){Jusou.openPlayer(movie.id,0)};document.getElementById("favorite").onclick=function(){var a=Jusou.toggleFavorite(movie);this.textContent=a?"♥ 已收藏":"♡ 加入片单";toast(a?"已加入我的片单":"已取消收藏")};
var home=await Jusou.home();document.getElementById("recommendations").innerHTML=(home.list||[]).filter(function(x){return String(x.id)!==String(movie.id)}).slice(0,6).map(function(x){return'<article class="movie-card" data-id="'+esc(x.id)+'"><div class="card-poster">'+(x.cover?'<img src="'+esc(x.cover)+'" alt="">':'<div class="poster-fallback"><strong>'+esc(x.name)+'</strong></div>')+'</div><div class="card-copy"><h3>'+esc(x.name)+'</h3><p>'+esc(x.type)+'</p></div></article>'}).join("");document.getElementById("recommendations").onclick=function(e){var c=e.target.closest("[data-id]");if(c)Jusou.openDetail(c.dataset.id)}}catch{box.innerHTML='<div class="empty-state"><h3>详情加载失败</h3><p>内容服务暂时不可用，请稍后再试。</p><a href="/">返回首页</a></div>'}})();
</script></body></html>
