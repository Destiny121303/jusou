<script src="./assets/js/data.js?v=8"></script><script src="./assets/js/ui.js?v=8"></script><script src="./assets/js/shell.js?v=8"></script><script>(function(){var grid=document.getElementById("exploreGrid"),ticket=0;function e(v){return String(v||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}function card(x){return'<article class="movie-card" tabindex="0" data-id="'+e(x.id)+'"><div class="card-poster">'+(x.cover?'<img src="'+e(x.cover)+'" alt="'+e(x.name)+'海报" loading="lazy" decoding="async">':'<div class="poster-fallback"><strong>'+e(x.name)+'</strong></div>')+'<span class="card-badge">'+e(x.remarks||"热播")+'</span></div><div class="card-copy"><h3>'+e(x.name)+'</h3><p><span>'+e(x.type)+'</span><span>'+e(x.year)+'</span></p></div></article>'}function rank(list,q){if(!q)return list;var k=q.toLowerCase();return list.slice().sort(function(a,b){function s(x){var n=String(x.name||"").toLowerCase(),all=[x.name,x.actor,x.type].join(" ").toLowerCase();return n===k?100:n.indexOf(k)===0?70:n.indexOf(k)>-1?50:all.indexOf(k)>-1?20:0}return s(b)-s(a)})}async function load(q){var id=++ticket;grid.innerHTML='<div class="page-loading">正在同步片库…</div>';try{var r=q?await Jusou.search(q):await Jusou.home();if(id!==ticket)return;var list=rank(r.list||[],q);document.getElementById("total").textContent=(r.total||list.length).toLocaleString();document.getElementById("exploreTitle").textContent=q?'“'+q+'”':"实时剧库";document.getElementById("resultMeta").textContent=list.length+" 条结果";grid.innerHTML=list.map(card).join("")||'<div class="empty-state"><h3>没有匹配内容</h3><p>试试更短的片名或其他分类。</p></div>'}catch(_){grid.innerHTML='<div class="empty-state"><h3>加载失败</h3><p>请稍后重试。</p></div>'}}document.getElementById("exploreSearch").onsubmit=function(ev){ev.preventDefault();load(document.getElementById("keyword").value.trim())};document.querySelector(".filter-sidebar").onclick=function(ev){var b=ev.target.closest("[data-query]");if(!b)return;this.querySelectorAll("button").forEach(function(x){x.classList.toggle("active",x===b)});load(b.dataset.query)};grid.onclick=function(ev){var c=ev.target.closest("[data-id]");if(c)Jusou.openDetail(c.dataset.id,c)};load("")})();</script></body></html>
